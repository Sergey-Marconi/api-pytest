[behave]
# Включает красивый структурированный вывод (как флаг -f pretty)
default_format = pretty

# Отключает перехват вывода (как флаг --no-capture)
# Теперь print и ошибки будут видны сразу в консоли
stderr_capture = false
stdout_capture = false

# Теги по умолчанию, если не переданы в командной строке
# Например, чтобы по умолчанию запускались только @test
default_tags = @test